<div class="app-blog-container">
  <div class="home-content">
    
    <!-- Categories Tabs Section -->
    <section class="categories-tabs-section" *ngIf="categories.length > 0">
      <div class="categories-tabs-container">
        <!-- Left Arrow for Categories -->
        <button 
          class="scroll-arrow category-scroll-arrow left-arrow"
          [class.disabled]="!canScrollCategoriesLeft"
          (click)="scrollCategories('left')"
          (keydown)="onCategoryKeyDown($event, 'left')"
          [disabled]="!canScrollCategoriesLeft"
          [attr.aria-label]="'Scroll categories left'">
          <mat-icon>chevron_left</mat-icon>
        </button>

        <div 
          class="categories-tabs"
          (scroll)="onCategoriesScroll()"
          (touchstart)="onCategoryTouchStart($event)"
          (touchend)="onCategoryTouchEnd($event)">
          <!-- All Categories Tab -->
          <button 
            class="category-tab"
            [class.active]="selectedCategoryId === null"
            (click)="onCategorySelect(null)">
            All
          </button>
          
          <!-- Individual Category Tabs -->
          <button 
            *ngFor="let category of categories"
            class="category-tab"
            [class.active]="selectedCategoryId === category.id"
            (click)="onCategorySelect(category.id)">
            {{ category.name }}
          </button>
        </div>

        <!-- Right Arrow for Categories -->
        <button 
          class="scroll-arrow category-scroll-arrow right-arrow"
          [class.disabled]="!canScrollCategoriesRight"
          (click)="scrollCategories('right')"
          (keydown)="onCategoryKeyDown($event, 'right')"
          [disabled]="!canScrollCategoriesRight"
          [attr.aria-label]="'Scroll categories right'">
          <mat-icon>chevron_right</mat-icon>
        </button>
      </div>
    </section>

    <!-- Subcategories Chips Section -->
    <section class="subcategories-section" *ngIf="subcategories.length > 0">
      <div class="subcategories-container">
        <!-- Left Arrow -->
        <button 
          class="scroll-arrow left-arrow"
          [class.disabled]="!canScrollLeft"
          (click)="scrollSubcategories('left')"
          (keydown)="onKeyDown($event, 'left')"
          [disabled]="!canScrollLeft"
          [attr.aria-label]="'Scroll subcategories left'">
          <mat-icon>chevron_left</mat-icon>
        </button>

        <!-- Subcategories Chips -->
        <div 
          class="subcategories-scroll-container"
          (scroll)="onSubcategoriesScroll()"
          (touchstart)="onTouchStart($event)"
          (touchend)="onTouchEnd($event)">
          <div class="subcategories-chips">
            <!-- All Subcategories Chip -->
            <button 
              class="subcategory-chip"
              [class.active]="selectedSubcategoryId === null"
              (click)="onSubcategorySelect(null)">
              All
            </button>
            
            <!-- Individual Subcategory Chips -->
            <button 
              *ngFor="let subcategory of subcategories"
              class="subcategory-chip"
              [class.active]="selectedSubcategoryId === subcategory.id"
              (click)="onSubcategorySelect(subcategory.id)">
              {{ subcategory.name }}
            </button>
          </div>
        </div>

        <!-- Right Arrow -->
        <button 
          class="scroll-arrow right-arrow"
          [class.disabled]="!canScrollRight"
          (click)="scrollSubcategories('right')"
          (keydown)="onKeyDown($event, 'right')"
          [disabled]="!canScrollRight"
          [attr.aria-label]="'Scroll subcategories right'">
          <mat-icon>chevron_right</mat-icon>
        </button>
      </div>
    </section>

    <!-- Loading State for Filtered Blogs -->
    <div class="loading-container" *ngIf="isLoadingBlogs">
      <mat-spinner diameter="40"></mat-spinner>
      <p>Loading blogs...</p>
    </div>

    <!-- Filtered Blogs Section -->
    <section class="filtered-blogs-section" *ngIf="!isLoadingBlogs && filteredBlogs.length > 0">
      <div class="section-header">
        <h2>
          <mat-icon>article</mat-icon>
          {{ selectedCategoryId ? 'Filtered' : 'Latest' }} Blogs
        </h2>
      </div>
      <div class="latest-grid">
        <app-blog-card 
          *ngFor="let blog of filteredBlogs" 
          [blogInput]="blog">
        </app-blog-card>
      </div>

      <!-- Pagination -->
      <div class="pagination-container" *ngIf="shouldShowPagination()">
        <mat-paginator 
          #paginator
          [length]="totalBlogs"
          [pageSize]="pageSize"
          [pageSizeOptions]="pageSizeOptions"
          [pageIndex]="currentPageIndex"
          (page)="onPageChange($event)"
          showFirstLastButtons
          class="blog-pagination">
        </mat-paginator>
      </div>
    </section>

    <!-- No Blogs Found -->
    <section class="no-blogs-section" *ngIf="!isLoadingBlogs && filteredBlogs.length === 0 && selectedCategoryId">
      <div class="no-blogs-content">
        <mat-icon class="no-blogs-icon">article</mat-icon>
        <h3>No blogs found</h3>
        <p>No blogs available for the selected category/subcategory.</p>
        <button mat-raised-button color="primary" (click)="onCategorySelect(null)">
          <mat-icon>refresh</mat-icon>
          Show All Blogs
        </button>
      </div>
    </section>

  </div>
</div>
