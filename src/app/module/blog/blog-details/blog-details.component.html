<div class="app-blog-container">
<div class="blog-detail-container">
    <!-- Loading State -->
    <div *ngIf="isLoading()" class="loading-state">
      <div class="loader-overlay"> 
        <img src="assets/icons/loader.gif" alt="Loading...">
        <p>Loading blog post...</p>
      </div>
    </div>

    <!-- Blog exists -->
    <div *ngIf="blog() as b; else noBlog" class="blog-content">
      <header class="blog-header">
        <h1>{{ b.title }}</h1>
        <div class="blog-meta">
          <span class="author">By {{ b.author }}</span>
          <span class="date">{{ formatDate(b.published_at) }}</span>
          <span class="views">{{ b.views }} views</span>
        </div>
  
        <!-- Category and Tags -->
        <div class="blog-tags" *ngIf="b.category || b.tags?.length">
          <mat-chip *ngIf="b.category" color="primary">{{ b.category.name }}</mat-chip>
          <mat-chip *ngIf="b.subcategory" color="accent">{{ b.subcategory.name }}</mat-chip>
          <mat-chip *ngFor="let tag of b.tags" color="warn">{{ tag }}</mat-chip>
        </div>
      </header>
  
      <!-- Featured Image -->
      <div class="featured-image" *ngIf="b.featured_image">
        <img
          [ngSrc]="getImageUrl(b.featured_image)"
          [alt]="b.title"
          (error)="onImageError($event)"
          width="800"
          height="400"
          priority
        />
      </div>
  
      <!-- Excerpt -->
      <div class="blog-excerpt" *ngIf="b.excerpt">
        <p>{{ b.excerpt }}</p>
      </div>
  
      <div class="blog-body">
        <div [innerHTML]="blogContent"></div>
      </div>
    </div>

    <!-- Template for when blog doesn't exist -->
    <ng-template #noBlog>
      <!-- Blog not found (only show after loading is complete) -->
      <div *ngIf="!isLoading()" class="not-found">
        <h4>Blog not found</h4>
        <p>The requested blog post could not be found.</p>
      </div>
    </ng-template>
  </div>
</div>
