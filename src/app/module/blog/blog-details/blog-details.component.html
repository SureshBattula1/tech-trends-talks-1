<div class="app-blog-container">
<div class="blog-detail-container">
    <!-- Loading State -->
    <div *ngIf="isLoading()" class="loading-state">
      <div class="loader-overlay"> 
        <img src="assets/icons/loader_new.svg" alt="Loading...">
        <p>Loading blog post...</p>
      </div>
    </div>

    <!-- Blog exists -->
    <div *ngIf="blog() as b; else noBlog" class="blog-content">
      <!-- SEO-optimized header -->
      <header class="blog-header">
        <h1 class="blog-title-seo">{{ b.title }}</h1>
        
        <!-- Article metadata for SEO -->
        <div class="blog-meta" itemscope itemtype="https://schema.org/Article">
          <meta itemprop="headline" [content]="b.title">
          <meta itemprop="description" [content]="b.excerpt || ''">
          <meta itemprop="datePublished" [content]="b.published_at">
          <meta itemprop="dateModified" [content]="b.updated_at || b.published_at">
          
          <span class="author" itemprop="author" itemscope itemtype="https://schema.org/Person">
            By <span itemprop="name">{{ b.author || 'Tech Trends Talks' }}</span>
          </span>
          <span class="date">
            <time [attr.datetime]="b.published_at" itemprop="datePublished">
              {{ formatDate(b.published_at) }}
            </time>
          </span>
          <span class="views">{{ b.views || 0 }} views</span>
        </div>
  
        <!-- Category and Tags -->
        <div class="blog-tags" *ngIf="b.category || b.tags?.length">
          <mat-chip *ngIf="b.category" color="primary">{{ b.category.name }}</mat-chip>
          <mat-chip *ngIf="b.subcategory" color="accent">{{ b.subcategory.name }}</mat-chip>
          <mat-chip *ngFor="let tag of b.tags" color="warn">{{ tag }}</mat-chip>
        </div>
      </header>
  
      <!-- Featured Image with SEO optimization -->
      <div class="featured-image" *ngIf="b.featured_image" itemprop="image" itemscope itemtype="https://schema.org/ImageObject">
        <img
          [ngSrc]="getImageUrl(b.featured_image)"
          [alt]="b.title + ' - Tech Trends Talks Blog'"
          (error)="onImageError($event)"
          width="1200"
          height="630"
          priority
          itemprop="url contentUrl"
        />
        <meta itemprop="width" content="1200">
        <meta itemprop="height" content="630">
        <meta itemprop="caption" [content]="b.title">
      </div>
  
      <!-- Excerpt -->
      <div class="blog-excerpt" *ngIf="b.excerpt">
        <p>{{ b.excerpt }}</p>
      </div>
  
      <!-- Main article content -->
      <article class="blog-body" itemprop="articleBody">
        <div [innerHTML]="blogContent"></div>
        
        <!-- Publisher information for SEO -->
        <div class="publisher-info" style="display: none;" itemscope itemtype="https://schema.org/Organization" itemprop="publisher">
          <meta itemprop="name" content="Tech Trends Talks">
          <meta itemprop="url" content="https://techtrendstalks.com">
          <div itemprop="logo" itemscope itemtype="https://schema.org/ImageObject">
            <meta itemprop="url" content="https://techtrendstalks.com/assets/images/techtrendstalks-logo.jpeg">
            <meta itemprop="width" content="250">
            <meta itemprop="height" content="60">
          </div>
        </div>
      </article>
      
      <!-- Social sharing section -->
      <div class="blog-sharing" *ngIf="blog() as b">
        <h3>Share this article:</h3>
        <div class="share-buttons">
          <button (click)="shareOnSocial('facebook')" class="share-btn facebook" aria-label="Share on Facebook">
            <mat-icon>facebook</mat-icon> Facebook
          </button>
          <button (click)="shareOnSocial('twitter')" class="share-btn twitter" aria-label="Share on Twitter">
            <mat-icon>share</mat-icon> Twitter
          </button>
          <button (click)="shareOnSocial('linkedin')" class="share-btn linkedin" aria-label="Share on LinkedIn">
            <mat-icon>business</mat-icon> LinkedIn
          </button>
          <button (click)="shareOnSocial('whatsapp')" class="share-btn whatsapp" aria-label="Share on WhatsApp">
            <mat-icon>chat</mat-icon> WhatsApp
          </button>
          <button (click)="copyLink()" class="share-btn copy" [class.copied]="isCopied()" aria-label="Copy link">
            <mat-icon>{{ isCopied() ? 'check' : 'link' }}</mat-icon> {{ isCopied() ? 'Copied!' : 'Copy Link' }}
          </button>
        </div>
      </div>
    </div>

    <!-- Template for when blog doesn't exist -->
    <ng-template #noBlog>
      <!-- Blog not found (only show after loading is complete) -->
      <div *ngIf="!isLoading()" class="not-found">
        <h4>Blog not found</h4>
        <p>The requested blog post could not be found.</p>
      </div>
    </ng-template>
  </div>
</div>
