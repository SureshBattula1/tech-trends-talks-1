<app-navbar [moduleName]="'BLOGS_ADMIN'"></app-navbar>
<mat-sidenav-container class="component-viewer-sidenav-container">
    <mat-sidenav class="component-sidenav" [opened]="isVisible()" [mode]="'side'">
        <div class="component-viewer-nav">
            <div class="component-viewer-nav-content">
            <mat-nav-list>
                <a mat-list-item routerLink="/blogs-admin/dashboard" routerLinkActive="navbar-header-item-selected" [routerLinkActiveOptions]="{ exact: true }"> Dashboard </a>
                <a mat-list-item routerLink="/blogs-admin/create-post" routerLinkActive="navbar-header-item-selected" [routerLinkActiveOptions]="{ exact: true }"> Create post </a>
               
            </mat-nav-list>
            </div>
        </div>
    </mat-sidenav>
    <mat-sidenav-content>
        <app-loader *ngIf="loader.loading$ | async"></app-loader>
        <div class="component-sidenav-content">
            <div class="component-sidenav-inner-content">
                <main class="component-sidenav-body-content">
                    <app-component-viewer></app-component-viewer>
                    <app-footer></app-footer>
                </main>
            </div>
        </div>
    </mat-sidenav-content>
</mat-sidenav-container>
