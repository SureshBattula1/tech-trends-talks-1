<app-navbar [moduleName]="'BLOGS_ADMIN'">
    <!-- Profile Icon with Hover Menu -->
    <div
        class="profile-container"
        [matMenuTriggerFor]="profileMenu"
        matTooltip="Profile Settings"
        (mouseenter)="menuTrigger.openMenu()"
        #menuTrigger="matMenuTrigger"
        >
        <button mat-icon-button>
            <mat-icon>account_circle</mat-icon>
        </button>
    </div>

    <mat-menu #profileMenu="matMenu" class="app-profile-menu-list">
        <button mat-menu-item (click)="goToHome()">
            <mat-icon>home</mat-icon>
            <span>Home</span>
        </button>
        <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Logout</span>
        </button>
    </mat-menu>

</app-navbar>

<mat-sidenav-container class="component-viewer-sidenav-container">
    <mat-sidenav class="component-sidenav" [opened]="isVisible()" [mode]="'side'">
        <div class="component-viewer-nav">
            <div class="component-viewer-nav-content">
                <div class="admin-header" style="display: none;">
                    <h3>{{ authService.isAdmin() ? 'Admin Panel' : 'User Dashboard' }}</h3>
                    <p>{{ authService.isAdmin() ? 'Blog Management' : 'Blog Overview' }}</p>
                </div>
                <mat-nav-list>
                    <a mat-list-item (click)="menuClick()" routerLink="/blogs-admin/dashboard" routerLinkActive="navbar-header-item-selected" [routerLinkActiveOptions]="{ exact: true }">
                        <mat-icon>dashboard</mat-icon>
                        <span>Dashboard</span>
                    </a>
                    
                    <!-- @if(authService.isAdmin()){ -->
                        <a mat-list-item (click)="menuClick()" routerLink="/blogs-admin/create-post" routerLinkActive="navbar-header-item-selected" [routerLinkActiveOptions]="{ exact: true }">
                            <mat-icon>add_circle</mat-icon>
                            <span>Create Post</span>
                        </a>
                        <a mat-list-item (click)="menuClick()" routerLink="/blogs-admin/categories" routerLinkActive="navbar-header-item-selected" [routerLinkActiveOptions]="{ exact: true }">
                            <mat-icon>category</mat-icon>
                            <span>Categories</span>
                        </a>
                        <a mat-list-item (click)="menuClick()" routerLink="/blogs-admin/subcategories" routerLinkActive="navbar-header-item-selected" [routerLinkActiveOptions]="{ exact: true }">
                            <mat-icon>subdirectory_arrow_right</mat-icon>
                            <span>Subcategories</span>
                        </a>
                    <!-- } -->
                    
                    <a mat-list-item (click)="menuClick()" routerLink="/blogs-admin/blogs" routerLinkActive="navbar-header-item-selected" [routerLinkActiveOptions]="{ exact: true }">
                        <mat-icon>article</mat-icon>
                        <span>Blogs</span>
                    </a>
                    
                    <a mat-list-item (click)="goToHome()">
                        <mat-icon>home</mat-icon>
                        <span>Home</span>
                    </a>
                </mat-nav-list>
            </div>
        </div>
    </mat-sidenav>
    
    <mat-sidenav-content>
        <app-loader *ngIf="loader.loading$ | async"></app-loader>
        <div class="component-sidenav-content">
            <div class="component-sidenav-inner-content">
                <main class="component-sidenav-body-content">
                    <router-outlet></router-outlet>
                    <app-footer></app-footer>
                </main>
            </div>
        </div>
    </mat-sidenav-content>
</mat-sidenav-container>
