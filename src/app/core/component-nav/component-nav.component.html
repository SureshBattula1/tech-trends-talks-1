<div class="component-viewer-nav">
    <div class="component-viewer-nav-content">
      <mat-nav-list>
             <a mat-list-item (click)="menuClose()" routerLink="/blogs/home" routerLinkActive="navbar-header-item-selected" [routerLinkActiveOptions]="{ exact: true }"> Blogs </a>
             <a mat-list-item (click)="menuClose()" routerLink="/loan-eligibility-calculator/checker" routerLinkActive="navbar-header-item-selected" [routerLinkActiveOptions]="{ exact: true }"> Loan Eligibility </a>
             
            <a mat-list-item (click)="menuClose()"  routerLink="/calculator/emi-calculator" routerLinkActive="navbar-header-item-selected" [routerLinkActiveOptions]="{ exact: true }"> EMI Calculator </a>
            <a mat-list-item (click)="menuClose()"  routerLink="/calculator/sip-calculator" routerLinkActive="navbar-header-item-selected"  [routerLinkActiveOptions]="{ exact: true }"> SIP Calculator </a>
            <a mat-list-item (click)="menuClose()"  routerLink="/calculator/swp-calculator" routerLinkActive="navbar-header-item-selected"  [routerLinkActiveOptions]="{ exact: true }"> SWP Calculator </a>
            <a mat-list-item (click)="menuClose()"  routerLink="/calculator/step-up-sip-calculator" routerLinkActive="navbar-header-item-selected"  [routerLinkActiveOptions]="{ exact: true }"> Step Up SIP Calculator </a>
            <!-- <a mat-list-item (click)="menuClose()"  routerLink="/calculator/grade-calculator" routerLinkActive="navbar-header-item-selected"  [routerLinkActiveOptions]="{ exact: true }"> GRADE Calculator </a> -->
             
            @if(!isAuthenticated){
              <a mat-list-item (click)="menuClose()" routerLink="/login" routerLinkActive="navbar-header-item-selected" [routerLinkActiveOptions]="{ exact: true }"> Login </a>
            } @else {
              <a mat-list-item (click)="menuClose()" routerLink="/blogs-admin/dashboard" routerLinkActive="navbar-header-item-selected" [routerLinkActiveOptions]="{ exact: true }"> Dashboard </a>
              <a mat-list-item (click)="logout()" routerLinkActive="navbar-header-item-selected" [routerLinkActiveOptions]="{ exact: true }"> Logout </a>
              }
        </mat-nav-list>
    </div>
</div>
