<div class="login-container">
  <mat-card class="login-card">
    <h2>Login</h2>
    <form>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" required />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" required />
        <button mat-icon-button matSuffix (click)="togglePasswordVisibility()" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="!hidePassword">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      <button mat-raised-button color="primary" class="full-width">Login</button>
    </form>

    <div class="login-links">
      <a routerLink="/register">Register</a>
      <span> | </span>
      <a routerLink="/forgot-password">Forgot Password?</a>
    </div>
  </mat-card>
</div>
